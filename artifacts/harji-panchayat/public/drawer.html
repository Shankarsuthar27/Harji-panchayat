<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Off-Canvas Navigation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Reset and Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #8c8c8c; /* Outer background to simulate the phone frame backdrop */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      margin: 0;
    }

    /* Mobile Frame Simulation */
    .mobile-frame {
      position: relative;
      width: 375px;
      height: 812px;
      background-color: #f7f7f7; /* Sidebar background color */
      border-radius: 40px;
      border: 8px solid #1a1a1a;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    @media (max-width: 420px) {
      body {
        background-color: #f7f7f7;
      }
      .mobile-frame {
        width: 100vw;
        height: 100dvh;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* --- Sidebar Styles --- */
    .sidebar {
      position: absolute;
      top: 0;
      left: 0;
      width: 70%;
      height: 100%;
      padding: 60px 20px 20px 30px;
      display: flex;
      flex-direction: column;
    }

    .profile {
      display: flex;
      flex-direction: column;
      margin-bottom: 30px;
    }

    .profile img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #e0e0e0;
      margin-bottom: 15px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .profile h2 {
      font-size: 18px;
      color: #000;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .profile p {
      font-size: 13px;
      color: #888;
    }

    .nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .nav-links li {
      padding: 14px 20px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 15px;
      font-weight: 500;
      color: #333;
      transition: background-color 0.3s ease;
      user-select: none;
    }

    .nav-links li i {
      font-size: 18px;
      color: #333;
      width: 20px;
      text-align: center;
      transition: transform 0.2s ease;
    }

    /* Active / Hover State */
    .nav-links li:hover, .nav-links li.active {
      background-color: #e5e5e5;
    }

    .nav-links li.active i {
      font-weight: 900; /* Simulates a filled icon */
    }

    /* --- Main Content Styles --- */
    .main-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      z-index: 10;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), border-radius 0.4s ease, box-shadow 0.4s ease;
      transform-origin: left center;
      box-shadow: -10px 0 20px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 20px;
      margin-top: 20px;
    }

    .menu-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #000;
      outline: none;
      padding: 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .menu-btn:hover {
      background-color: #f0f0f0;
    }

    .content-area {
      padding: 24px;
      flex: 1;
    }

    .screen-title {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin-bottom: 12px;
    }

    .screen-desc {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }

    /* Screen Overlay for closing when open */
    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: none;
      cursor: pointer;
    }

    /* --- Animation State Classes --- */
    .mobile-frame.menu-open .main-content {
      transform: translateX(65%) scale(0.9) translateZ(0);
      border-radius: 35px;
      box-shadow: -15px 0 30px rgba(0,0,0,0.12);
      cursor: pointer;
    }

    .mobile-frame.menu-open .screen-overlay {
      display: block;
    }
  </style>
</head>
<body>

  <div class="mobile-frame" id="app">
    
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
      <div class="profile">
        <!-- Placeholder for Avatar -->
        <img src="https://api.dicebear.com/7.x/notionists/svg?seed=Arafat" alt="Avatar">
        <h2>Arafat Sany</h2>
        <p>UX/UI Designer</p>
      </div>
      <ul class="nav-links">
        <li class="active" onclick="setActive(this)"><i class="fa-solid fa-house"></i> Home</li>
        <li onclick="setActive(this)"><i class="fa-regular fa-clone"></i> Topics</li>
        <li onclick="setActive(this)"><i class="fa-regular fa-envelope"></i> Messages</li>
        <li onclick="setActive(this)"><i class="fa-regular fa-bell"></i> Notifications</li>
        <li onclick="setActive(this)"><i class="fa-regular fa-bookmark"></i> Bookmarks</li>
        <li onclick="setActive(this)"><i class="fa-regular fa-user"></i> Profile</li>
      </ul>
    </nav>

    <!-- Main View -->
    <main class="main-content">
      <header>
        <button class="menu-btn" id="menuToggle" aria-label="Toggle Navigation">
          <i class="fa-solid fa-bars-staggered"></i>
        </button>
      </header>
      
      <div class="content-area">
        <h1 class="screen-title" id="pageTitle">Home</h1>
        <p class="screen-desc">
          Tap the top-right menu button to toggle the 3D off-canvas drawer. Tapping anywhere outside the sidebar smoothly slides the screen back.
        </p>
      </div>

      <!-- Invisible overlay to close menu by tapping main screen -->
      <div class="screen-overlay" id="overlay"></div>
    </main>
  </div>

  <script>
    const appContainer = document.getElementById('app');
    const menuToggleBtn = document.getElementById('menuToggle');
    const overlay = document.getElementById('overlay');
    const pageTitle = document.getElementById('pageTitle');

    // Open Menu
    menuToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      appContainer.classList.add('menu-open');
    });

    // Close Menu by clicking on the main content
    overlay.addEventListener('click', () => {
      appContainer.classList.remove('menu-open');
    });

    // Handle Active States for Links
    function setActive(element) {
      // Remove active class from all
      document.querySelectorAll('.nav-links li').forEach(li => {
        li.classList.remove('active');
        // Reset to outline icons
        const icon = li.querySelector('i');
        if(icon.classList.contains('fa-solid') && !icon.classList.contains('fa-house') && !icon.classList.contains('fa-bars-staggered')) {
             icon.classList.replace('fa-solid', 'fa-regular');
        }
      });
      
      // Add active class to clicked element
      element.classList.add('active');
      
      // Update screen title
      if (pageTitle) {
        pageTitle.textContent = element.innerText.trim();
      }

      // Swap to filled icon on active
      const activeIcon = element.querySelector('i');
      if(activeIcon.classList.contains('fa-regular')) {
         activeIcon.classList.replace('fa-regular', 'fa-solid');
      }

      // Smoothly close after selection
      setTimeout(() => {
        appContainer.classList.remove('menu-open');
      }, 180);
    }
  </script>
</body>
</html>
